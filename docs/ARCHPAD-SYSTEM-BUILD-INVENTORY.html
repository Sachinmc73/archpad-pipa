      color: #0f172a;

    let activeLensKey = "provenance";

    let openItems = new Set();

    // Render Filter Bar
    function renderFilterBar() {
      const container = document.getElementById("filterBar");
      container.innerHTML = "";
      const currentLens = lenses[activeLensKey];

      const allBtn = document.createElement("button");
      allBtn.className = `px-2.5 py-1 rounded text-xs transition border ${activeFilterVal === "all" ? "bg-[#21262d] text-white border-slate-500 font-medium" : "text-slate-400 border-transparent hover:text-white"}`;
      allBtn.textContent = "All";
      allBtn.onclick = () => { activeFilterVal = "all"; renderInventory(); renderFilterBar(); };
      container.appendChild(allBtn);

      for (const [key, conf] of Object.entries(currentLens.categories)) {
        const btn = document.createElement("button");
        const isActive = activeFilterVal === key;
        btn.className = `flex items-center gap-1.5 px-2.5 py-1 rounded text-xs transition border ${isActive ? "bg-[#21262d] text-white border-slate-500 font-medium" : "text-slate-400 border-transparent hover:text-white"}`;
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${conf.dot}"></span><span>${conf.label}</span>`;
        btn.onclick = () => {
          activeFilterVal = isActive ? "all" : key;
          renderInventory();
          renderFilterBar();
        };
        container.appendChild(btn);
      }
    }

    // Render Master Inventory List
    function renderInventory() {
      const container = document.getElementById("inventoryList");
      container.innerHTML = "";

      const currentLens = lenses[activeLensKey];
      const attr = currentLens.attr;

      // Group items
      const groups = {};
      inventory.forEach(item => {
        const val = item[attr] || "Other";
        if (!groups[val]) groups[val] = [];
        groups[val].push(item);
      });

      let totalVisible = 0;

      for (const [groupName, items] of Object.entries(groups)) {
        if (activeFilterVal !== "all" && groupName !== activeFilterVal) continue;

        const filteredItems = items.filter(item => {
          if (!activeSearchVal) return true;
          const blob = `${item.name} ${item.path} ${item.rationale} ${item.package} ${item.origin}`.toLowerCase();
          return blob.includes(activeSearchVal);
        });

        if (filteredItems.length === 0) continue;
        totalVisible += filteredItems.length;

        const conf = currentLens.categories[groupName] || { label: groupName, dot: "bg-slate-500", text: "text-slate-400" };

        const groupEl = document.createElement("div");
        groupEl.className = "border border-[#21262d] rounded-lg bg-[#161b22] overflow-hidden";

        // Group Header
        const groupHeader = document.createElement("div");
        groupHeader.className = "flex items-center justify-between px-3.5 py-2 bg-[#161b22] border-b border-[#21262d] text-xs font-semibold text-slate-300 select-none";
        groupHeader.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full ${conf.dot}"></span>
            <span>${conf.label}</span>
          </div>
          <span class="font-mono text-[11px] text-slate-500">${filteredItems.length}</span>
        `;
        groupEl.appendChild(groupHeader);

        // Group Items List
        const listEl = document.createElement("div");
        listEl.className = "divide-y divide-[#21262d]";

        filteredItems.forEach((item, index) => {
          const itemWrapper = document.createElement("div");
          const isOpen = openItems.has(item.name);
          const itemConf = currentLens.categories[item[attr]] || conf;

          itemWrapper.className = "unit-row";

          // Collapsed Tile Header
          const rowHeader = document.createElement("div");
          rowHeader.className = "flex items-center justify-between px-3.5 py-2.5 cursor-pointer select-none";
          rowHeader.innerHTML = `
            <div class="min-w-0 flex-1 pr-3">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="w-1.5 h-1.5 rounded-full ${itemConf.dot}"></span>
                <span class="font-mono text-xs font-medium text-white truncate">${item.name}</span>
                <span class="text-[10px] text-slate-500 font-mono truncate hidden sm:inline">${item.path}</span>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[11px] font-mono text-slate-400">${item.size}</span>
              <svg class="w-3.5 h-3.5 text-slate-500 transition-transform ${isOpen ? 'rotate-180 text-white' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          `;

          // Expanded Inline Accordion Details
          const rowContent = document.createElement("div");
          rowContent.className = `accordion-content px-3.5 ${isOpen ? 'open pb-3' : ''}`;
          rowContent.innerHTML = `
            <div class="pt-2.5 border-t border-[#21262d] space-y-3 text-xs">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div class="bg-[#0d1117] p-2.5 rounded border border-[#21262d]">
                  <span class="text-[10px] uppercase font-bold text-slate-500 block mb-0.5">Physical / Logical Location</span>
                  <span class="font-mono text-[11px] text-cyan-300 break-all">${item.path}</span>
                  <span class="block text-[11px] text-slate-400 mt-1">${item.storage} • ${item.unitType}</span>
                </div>
                <div class="bg-[#0d1117] p-2.5 rounded border border-[#21262d]">
                  <span class="text-[10px] uppercase font-bold text-slate-500 block mb-0.5">Source Origin & Maintainer</span>
                  <span class="text-[11px] text-slate-200 block">${item.origin}</span>
                  <span class="block text-[11px] text-slate-400 mt-1 font-mono">${item.package}</span>
                </div>
              </div>

              <div class="bg-[#0d1117] p-2.5 rounded border border-[#21262d]">
                <span class="text-[10px] uppercase font-bold text-slate-500 block mb-0.5">Build Recipe & Compilation Command</span>
                <span class="font-mono text-[11px] text-emerald-300 block select-all break-all">${item.recipe}</span>
              </div>

              <div class="bg-[#0d1117] p-2.5 rounded border border-[#21262d]">
                <span class="text-[10px] uppercase font-bold text-slate-500 block mb-0.5">Architectural Rationale & Hardware Problem Solved</span>
                <p class="text-[11px] text-slate-300 leading-relaxed">${item.rationale}</p>
              </div>

              <div class="flex items-center gap-1.5 flex-wrap pt-0.5">
                <span class="text-[10px] text-slate-500 uppercase font-bold mr-1">Direct Dependencies:</span>
                ${(item.deps || []).map(d => `<span class="px-1.5 py-0.5 rounded bg-[#21262d] font-mono text-[10px] text-slate-300">${d}</span>`).join('')}
              </div>
            </div>
          `;

          rowHeader.onclick = () => {
            if (openItems.has(item.name)) {
              openItems.delete(item.name);
            } else {
              openItems.add(item.name);
            }
            renderInventory();
          };

          itemWrapper.appendChild(rowHeader);
          itemWrapper.appendChild(rowContent);
          listEl.appendChild(itemWrapper);
        });

        groupEl.appendChild(listEl);
        container.appendChild(groupEl);
      }

      document.getElementById("unitCounter").textContent = totalVisible;
    }

    // Lens button switching
    document.querySelectorAll(".lens-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".lens-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeLensKey = btn.getAttribute("data-lens");
        activeFilterVal = "all";
        renderFilterBar();
        renderInventory();
      };
    });

    // Search filtering
    document.getElementById("searchInput").oninput = (e) => {
      activeSearchVal = e.target.value.toLowerCase().trim();
      renderInventory();
    };

    // Initial render
    renderFilterBar();
    renderInventory();
