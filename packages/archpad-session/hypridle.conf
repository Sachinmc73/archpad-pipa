# ArchPad tablet idle and sleep configuration

general {
    # lock_cmd is invoked by hypridle when logind sends the Lock signal.
    # pidof guard prevents double-launch (loginctl lock-session may fire
    # the signal more than once).
    lock_cmd = pidof hyprlock || /usr/lib/archpad-session/archpad-lock

    # before_sleep_cmd: signal logind to lock the session, which will
    # in turn fire lock_cmd above. Using loginctl (not archpad-lock
    # directly) is the standard pattern; it ensures the LockedHint
    # property is set and hypridle's own de-duplication works.
    before_sleep_cmd = loginctl lock-session

    # after_sleep_cmd: turn the display back on after resume using Hyprland Lua dispatcher.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Idle lock after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# DPMS off 30 s after locking
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
