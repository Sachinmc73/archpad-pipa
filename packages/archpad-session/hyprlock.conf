# ArchPad tablet lockscreen configuration
# Touch-first design for Xiaomi Pad 6 (pipa)

general {
    hide_cursor = false
    immediate_render = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(13, 21, 34, 1.0)
}

input-field {
    monitor =
    size = 360, 64
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(116, 167, 255, 0.8)
    inner_color = rgba(27, 38, 56, 0.95)
    font_color = rgb(244, 247, 255)
    fade_on_empty = false
    placeholder_text = <span foreground="##aebbd0">Enter password</span>
    hide_input = false
    rounding = 20
    check_color = rgba(116, 167, 255, 0.9)
    fail_color = rgba(255, 102, 102, 0.9)
    fail_text = <span foreground="##ff6666">Authentication failed</span>
    position = 0, -80
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = Sans
    color = rgb(244, 247, 255)
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 22
    font_family = Sans
    color = rgb(174, 187, 208)
    position = 0, 50
    halign = center
    valign = center
}

# ArchPad tablet badge
label {
    monitor =
    text = ArchPad
    font_size = 14
    font_family = Sans
    color = rgba(174, 187, 208, 0.6)
    position = 0, 40
    halign = center
    valign = bottom
}
