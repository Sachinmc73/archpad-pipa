# PipeWire lookahead limiter configuration for Xiaomi Pad 6 (pipa)
# Catches digital transients > -7.5 dBFS to prevent AW88261 Sigma-Delta Modulator saturation

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Built-in Speakers"
            media.name       = "Speaker Playback Limiter"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = limiter
                        plugin = fast_lookahead_limiter_1913
                        label  = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)" = 0.0
                            "Limit (dB)" = -7.5
                            "Release time (s)" = 0.05
                        }
                    }
                ]
                inputs  = [ "limiter:Input 1" "limiter:Input 2" ]
                outputs = [ "limiter:Output 1" "limiter:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ "FL" "FR" ]
            capture.props = {
                node.name        = "effect_input.speaker_limiter"
                media.class      = "Audio/Sink"
                node.description = "Built-in Speakers"
                priority.driver  = 1001
                priority.session = 1001
            }
            playback.props = {
                node.name        = "effect_output.speaker_limiter"
                node.passive     = true
                target.object    = "alsa_output.platform-sound.HiFi__Speaker__sink"
            }
        }
    }
]
