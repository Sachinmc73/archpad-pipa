# WirePlumber configuration for Xiaomi Pad 6 (pipa)
# Aligns period size with Qualcomm QDSP6 hardware constraints (480 samples @ 48kHz = 10ms frame)
# Locks raw ALSA sink volume so PipeWire volume controls act on the limiter sink

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        audio.format            = "S16LE"
        audio.rate              = 48000
        audio.channels          = 2
        audio.position          = [ "FL" "FR" ]
        api.alsa.period-size    = 480
        api.alsa.period-num     = 6
        api.alsa.headroom       = 480
        channelmix.lock-volumes = true
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_input.platform-sound.HiFi__Mic__source" }
    ]
    actions = {
      update-props = {
        audio.format        = "S16LE"
        audio.rate          = 44100
        audio.channels      = 2
        audio.position      = [ "FL" "FR" ]
      }
    }
  }
]
