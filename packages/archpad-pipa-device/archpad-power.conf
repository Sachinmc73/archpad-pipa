# /etc/archpad/power.conf - ArchPad Power Management Configuration
# Xiaomi Pad 6 (Qualcomm Snapdragon 870 / SM8250)
#
# Changes take effect immediately by running: archpad-powerctl reload
# To reset to factory defaults, run: archpad-powerctl reset
#
# Hardware Limits:
#   cpu_silver_max_freq: 300000 - 1804800 kHz (Cluster 0: Cores 0-3, Kryo Silver / Cortex-A55)
#   cpu_gold_max_freq:   710400 - 2419200 kHz (Cluster 1: Cores 4-6, Kryo Gold / Cortex-A77)
#   cpu_prime_max_freq:  844800 - 3187200 kHz (Cluster 2: Core 7, Kryo Prime / Cortex-A77)
#   gpu_max_freq:        305000000 - 670000000 Hz (Adreno 650 GPU)
#   schedutil_rate_limit_us: 500 - 100000 us (Kernel scheduler frequency transition latency)
#   pcie_aspm_policy:    powersupersave | powersave | default | performance
#   display_refresh_rate: 30 | 48 | 60 | 90 | 120 | 0 (Hz, 0 disables automatic refresh rate management)

[power-saver]
# Energy saving profile: caps high-voltage power states for maximum battery life
cpu_silver_max_freq = 1420800
cpu_gold_max_freq = 1478400
cpu_prime_max_freq = 1747200
gpu_max_freq = 400000000
schedutil_rate_limit_us = 20000
pcie_aspm_policy = powersupersave
display_refresh_rate = 60

[balanced]
# Standard profile: dynamic energy-aware scheduling across all cores
cpu_silver_max_freq = 1804800
cpu_gold_max_freq = 2419200
cpu_prime_max_freq = 2841600
gpu_max_freq = 670000000
schedutil_rate_limit_us = 10000
pcie_aspm_policy = powersupersave
display_refresh_rate = 120

[performance]
# Maximum throughput profile: enables 3.20 GHz Prime boost and instantaneous scaling
cpu_silver_max_freq = 1804800
cpu_gold_max_freq = 2419200
cpu_prime_max_freq = 3187200
gpu_max_freq = 670000000
schedutil_rate_limit_us = 1000
pcie_aspm_policy = default
display_refresh_rate = 120

