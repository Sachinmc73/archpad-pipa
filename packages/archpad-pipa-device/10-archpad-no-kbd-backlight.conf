<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <!-- Deny access to UPower's static dummy KbdBacklight interface.
         Xiaomi Pad 6 has no physical keyboard backlight hardware.
         Blocking this prevents KDE PowerDevil / Plasma 6 from falsely
         detecting keyboard backlight and displaying a useless 0/0 slider. -->
    <deny send_destination="org.freedesktop.UPower"
          send_interface="org.freedesktop.UPower.KbdBacklight"/>
  </policy>
</busconfig>
